name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Check all source JS syntax and duplicate class methods
        run: node test/check-sources.cjs

      - name: Check generated JS syntax
        run: node --check family-calendar-card.js
